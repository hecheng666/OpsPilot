server:
  port: ${DEMO_PORT:8081}

spring:
  application:
    name: ops-demo-service
  datasource:
    url: ${DEMO_DB_URL:jdbc:mysql://localhost:3306/ops_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: warn
    com.opspilot: info
